const SECS = ["destacados","también","evitar"];
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => "$" + n.toLocaleString("es-AR");
const initials = a => a.replace(/^the /i,"").split(/[\s/&,]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("");
const styles = ["todos", ...Array.from(new Set(D.map(x => x.e)))];
let current = "todos";
try { const s = localStorage.getItem("feria-estilo"); if (s && styles.includes(s)) current = s; } catch (e) {}

function row(x){
  const key = x.a + " | " + x.d;
  const cv = COVERS[key] ? '<img src="'+COVERS[key]+'" alt="">' : esc(initials(x.a));
  const fl = (x.tags||[]).map(t => t==="origen" ? "país de origen" : t==="ganga" ? "buen precio" : t.startsWith("alerta:") ? t.slice(7) : "").filter(Boolean);
  const flags = fl.length ? ' · <span class="fl">'+fl.map(esc).join(" · ")+'</span>' : "";
  return '<li class="it"><div class="cv" aria-hidden="true">'+cv+'</div>'+
    '<div class="tx"><span class="name"><span class="who">'+esc(x.a)+'</span> '+esc(x.d)+'</span>'+
    '<span class="data">'+esc(x.ed.toLowerCase())+' · '+esc(x.g.toLowerCase())+flags+'</span>'+
    '<span class="why">'+esc(x.w)+'</span></div>'+
    '<span class="pr">'+fmt(x.p)+'<small>usd '+Math.round(x.p/USD)+'</small></span></li>';
}
function render(){
  document.getElementById("sections").innerHTML = SECS.map((s,i) => {
    const items = D.filter(x => x.t === s && (current === "todos" || x.e === current));
    return '<section class="reveal '+(s==="evitar"?"evitar":"")+'" style="--d:'+(120+i*30)+'ms"><h2>'+s+' · '+String(items.length).padStart(2,"0")+'</h2>'+
      '<ul class="list">'+(items.length ? items.map(row).join("") : '<li class="empty">nada de este estilo</li>')+'</ul></section>';
  }).join("");
  document.querySelectorAll(".f").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === current ? "true" : "false"));
}
const f = document.getElementById("filters");
f.innerHTML = styles.map(s => '<li><button type="button" class="f" data-s="'+esc(s)+'">'+esc(s)+'</button></li>').join("");
f.addEventListener("click", ev => {
  const b = ev.target.closest(".f"); if (!b) return;
  current = b.dataset.s;
  try { localStorage.setItem("feria-estilo", current); } catch (e) {}
  render();
});
render();
